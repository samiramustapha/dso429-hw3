name: quiz-loop
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/quiz-loop.yml"]
permissions:
  contents: write
concurrency:
  group: quiz-loop
  cancel-in-progress: false
jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every 4 minutes for ~5.6 hours
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          end=$((SECONDS + 335*60))
          while [ $SECONDS -lt $end ]; do
            [ "$(date -u +%s)" -gt 1792702800 ] && echo "HW3 over" && break
            git pull -q --rebase origin main || true
            python3 solve.py || true
            git add answers
            if ! git diff --cached --quiet; then
              git commit -q -m "answers $(date -u +%FT%TZ)"
              for i in 1 2 3; do
                git pull -q --rebase origin main && git push -q origin HEAD:main && break
                sleep 10
              done
            fi
            sleep 240
          done
